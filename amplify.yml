version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
        # Fetch secrets from SSM and write to .env for Next.js to bundle
        - |
          DB_PASSWORD=$(aws ssm get-parameter --name /bearable-senior/db-password --with-decryption --query 'Parameter.Value' --output text --region us-east-1)
          CRON_SECRET=$(aws ssm get-parameter --name /bearable-senior/cron-secret --with-decryption --query 'Parameter.Value' --output text --region us-east-1)
          RDS_ENDPOINT=$(aws ssm get-parameter --name /bearable-senior/rds-endpoint --query 'Parameter.Value' --output text --region us-east-1)
          echo "DATABASE_URL=postgresql://bearable_admin:$DB_PASSWORD@$RDS_ENDPOINT:5432/bearable_senior?sslmode=no-verify" >> .env.production
          echo "CRON_SECRET=$CRON_SECRET" >> .env.production
          echo "REGION=us-east-1" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
